name: Flutter Auto Release

on:
  workflow_dispatch: # 保留手动触发，方便你随时手动打个包
  push:
    branches: [ main ] # 已经为你开启！每次 push 到 main 分支都会触发

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' 

      - name: Install dependencies
        run: flutter pub get

      # 1. 动态计算下一个版本号
      - name: Calculate Next Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q ".tagName" 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "没有找到历史 Release，默认发布首个版本 v1.0.0"
            NEW_VERSION="1.0.0"
            NEW_TAG="v1.0.0"
          else
            echo "当前最新 Release 版本为: $LATEST_TAG"
            VERSION_NUM=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEW_TAG="v${NEW_VERSION}"
          fi
          
          echo "计算出的新版本为: $NEW_TAG"
          echo "APP_VERSION=$NEW_TAG" >> $GITHUB_ENV
          echo "BUILD_NAME=$NEW_VERSION" >> $GITHUB_ENV

      # 2. 构建 APK（动态注入版本号）
      - name: Build APK
        run: flutter build apk --release --build-name=${{ env.BUILD_NAME }}
        
      # 3. 创建 GitHub Release 并上传
      - name: Create Release and Upload APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}     
          name: Release ${{ env.APP_VERSION }} 
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true         
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 创建 Gitee Release 并同步上传 APK
      - name: Create Release and Upload APK to Gitee
        uses: nICEnnnnnnnLee/action-gitee-release@master
        with:
          gitee_action: create_release
          gitee_owner: ${{ secrets.GITEE_OWNER }} 
          gitee_repo: ${{ secrets.GITEE_REPO }}   
          gitee_token: ${{ secrets.GITEE_TOKEN }} 
          gitee_tag_name: ${{ env.APP_VERSION }}  
          gitee_release_name: Release ${{ env.APP_VERSION }}
          gitee_release_body: 自动发布的新版本 ${{ env.APP_VERSION }}
          gitee_target_commitish: main 
          gitee_file_name: app-release.apk 
          gitee_file_path: build/app/outputs/flutter-apk/app-release.apk 
          gitee_upload_retry_times: 3