name: Flutter Auto Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' 

      - name: Install dependencies
        run: flutter pub get

      # 1. 动态计算下一个版本号
      - name: Calculate Next Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q ".tagName" 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "没有找到历史 Release，默认发布首个版本 v1.0.0"
            NEW_VERSION="1.0.0"
            NEW_TAG="v1.0.0"
          else
            echo "当前最新 Release 版本为: $LATEST_TAG"
            VERSION_NUM=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEW_TAG="v${NEW_VERSION}"
          fi
          
          echo "计算出的新版本为: $NEW_TAG"
          echo "APP_VERSION=$NEW_TAG" >> $GITHUB_ENV
          echo "BUILD_NAME=$NEW_VERSION" >> $GITHUB_ENV

      # 2. 构建 APK（动态注入版本号）
      - name: Build APK
        run: flutter build apk --release --build-name=${{ env.BUILD_NAME }}
        
      # 3. 创建 GitHub Release 并上传
      - name: Create Release and Upload APK to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}     
          name: Release ${{ env.APP_VERSION }} 
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true         
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 调用 Gitee 官方 API 创建 Release 并上传 APK
      - name: Create Gitee Release and Upload APK via API
        run: |
          echo "==== 1. 创建 Gitee Release ===="
          # 发送 POST 请求创建 Release
          CREATE_RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}/releases" \
            -H "Content-Type: application/json" \
            -d '{
              "access_token": "${{ secrets.GITEE_TOKEN }}",
              "tag_name": "${{ env.APP_VERSION }}",
              "name": "Release ${{ env.APP_VERSION }}",
              "body": "自动发布的新版本 ${{ env.APP_VERSION }}",
              "target_commitish": "main"
            }')
          
          echo "创建 Release 响应: $CREATE_RESP"
          
          # 使用 jq 提取生成的 release 的 ID
          RELEASE_ID=$(echo $CREATE_RESP | jq -r '.id')
          
          # 判断是否获取到了合法的 ID（排查 Token 权限等错误）
          if [ "$RELEASE_ID" == "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "❌ 创建 Gitee Release 失败，请检查 Token 是否有效、是否有写入权限！"
            exit 1
          fi
          
          echo "✅ Gitee Release 创建成功，ID: $RELEASE_ID"
          echo "==== 2. 上传 APK 到 Gitee Release ===="
          
          # 发送 POST 请求上传附件
          UPLOAD_RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/${{ secrets.GITEE_OWNER }}/${{ secrets.GITEE_REPO }}/releases/$RELEASE_ID/attach_files" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@build/app/outputs/flutter-apk/app-release.apk")
            
          echo "上传附件响应: $UPLOAD_RESP"
          echo "🎉 Gitee 发布流程执行完毕！"